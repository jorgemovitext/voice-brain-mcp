<div class="shell">
  <!-- Rail de iconos (como la referencia: logo arriba, avatar abajo) -->
  <aside class="rail">
    <a routerLink="/home" class="rail__logo" title="Movitext Brain">
      <span class="rail__logo-orb"></span>
    </a>

    <nav class="rail__nav">
      <a routerLink="/home" routerLinkActive="rail__btn--active" class="rail__btn" title="Inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      </a>
      <a routerLink="/contacts" routerLinkActive="rail__btn--active" class="rail__btn" title="Contactos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
      </a>
      <a routerLink="/conversations" routerLinkActive="rail__btn--active" class="rail__btn" title="Conversaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12"/></svg>
      </a>
      <!-- Demo del flujo: oculto por ahora (la ruta /demo sigue viva por URL) -->
      <a routerLink="/workers" routerLinkActive="rail__btn--active" class="rail__btn" title="Obreros">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 7V4"/><circle cx="12" cy="3" r="1"/><path d="M9 12h.01M15 12h.01"/><path d="M9.5 15.5c.8.6 4.2.6 5 0"/></svg>
      </a>
      <a routerLink="/integrations" routerLinkActive="rail__btn--active" class="rail__btn" title="Integraciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M14 6.5h4a2.5 2.5 0 0 1 2.5 2.5v1"/><path d="M10 17.5H6A2.5 2.5 0 0 1 3.5 15v-1"/></svg>
      </a>
    </nav>

    <div class="rail__bottom">
      <span class="rail__avatar" title="Operador">JM</span>
    </div>
  </aside>

  <main class="stage">
    <router-outlet />
  </main>
</div>
