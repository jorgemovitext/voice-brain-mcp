<!-- Celda de panal compartida: cualquier elemento con .hex-cell se recorta con
     esta forma. Vive acá, fuera de todo @if, porque un clipPath referenciado
     por url(#…) deja de aplicar si su SVG sale del DOM. En coordenadas
     relativas (objectBoundingBox), así sirve para 30 px o para 150. -->
<svg class="hex-defs" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="hexCell" clipPathUnits="objectBoundingBox">
      <path
        d="M.9.604 L.79.794 Q.73.898.61.898 L.39.898 Q.27.898.21.794 L.1.604 Q.04.5.1.396 L.21.206 Q.27.102.39.102 L.61.102 Q.73.102.79.206 L.9.396 Q.96.5.9.604 Z"
      />
    </clipPath>
  </defs>
</svg>

<div class="shell">
  <!-- Rail de iconos (como la referencia: logo arriba, avatar abajo).
       Oculto en /login: sin sesión no hay navegación que mostrar. -->
  @if (!enLogin()) {
  <aside class="rail">
    <a routerLink="/home" class="rail__logo" title="Hive">
      <span class="rail__logo-orb"></span>
    </a>

    <nav class="rail__nav">
      <a routerLink="/home" routerLinkActive="rail__btn--active" class="rail__btn" title="La colmena">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      </a>
      <a routerLink="/conversations" routerLinkActive="rail__btn--active" class="rail__btn" title="Conversaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12"/></svg>
      </a>
      <!-- Los agentes van después de Conversaciones.
           (Contactos sale del rail; la ruta sigue viva desde la búsqueda.) -->
      <a routerLink="/agentes" routerLinkActive="rail__btn--active" class="rail__btn" title="Agentes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 7V4"/><circle cx="12" cy="3" r="1"/><path d="M9 12h.01M15 12h.01"/><path d="M9.5 15.5c.8.6 4.2.6 5 0"/></svg>
      </a>
      <a routerLink="/canales" routerLinkActive="rail__btn--active" class="rail__btn" title="Canales">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92V20a1.5 1.5 0 0 1-1.64 1.5A19 19 0 0 1 2.5 3.64 1.5 1.5 0 0 1 4 2h3.09a1.5 1.5 0 0 1 1.48 1.25l.57 3.38a1.5 1.5 0 0 1-.43 1.35l-1.6 1.6a16 16 0 0 0 6.31 6.31l1.6-1.6a1.5 1.5 0 0 1 1.35-.43l3.38.57A1.5 1.5 0 0 1 22 16.92Z"/></svg>
      </a>
      <a routerLink="/actividad" routerLinkActive="rail__btn--active" class="rail__btn" title="Actividad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M14 6.5h4a2.5 2.5 0 0 1 2.5 2.5v1"/><path d="M10 17.5H6A2.5 2.5 0 0 1 3.5 15v-1"/></svg>
      </a>
    </nav>

    <div class="rail__bottom">
      <!-- Los avisos suenan distinto según lo que pasó; acá se apagan. La
           preferencia sobrevive a la sesión. -->
      <button class="rail__btn" (click)="sonido.alternar()"
              [title]="sonido.silenciado() ? 'Activar los avisos sonoros' : 'Silenciar los avisos sonoros'">
        @if (sonido.silenciado()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6"/><path d="m17 9 6 6"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
        }
      </button>
      <button class="rail__btn rail__logout" title="Cerrar sesión" (click)="cerrarSesion()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </aside>
  }

  <div class="cuerpo">
    <!-- Cabecera Hive: quién atiende y quién sos, presente en toda la app.
         Fuera del escenario a propósito — es el marco, no el contenido. -->
    @if (!enLogin()) {
      <header class="topbar">
        @if (agenteActivo(); as quien) {
          <a class="topbar__linea" routerLink="/canales" title="Ver las líneas y sus agentes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92V20a1.5 1.5 0 0 1-1.64 1.5A19 19 0 0 1 2.5 3.64 1.5 1.5 0 0 1 4 2h3.09a1.5 1.5 0 0 1 1.48 1.25l.57 3.38a1.5 1.5 0 0 1-.43 1.35l-1.6 1.6a16 16 0 0 0 6.31 6.31l1.6-1.6a1.5 1.5 0 0 1 1.35-.43l3.38.57A1.5 1.5 0 0 1 22 16.92Z"/></svg>
            {{ quien }}
          </a>
        }
        <a class="topbar__pill" routerLink="/integraciones" title="Estado de las integraciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          Soporte
        </a>
        <a class="topbar__redondo" routerLink="/contacts" title="Buscar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </a>

        <div class="topbar__derecha">
          <!-- El agente, vivo: el orbe gira mientras hay alguien atendiendo. -->
          @if (agenteActivo(); as quien) {
            <span class="topbar__agente" [title]="quien + ' está atendiendo'">
              <span class="topbar__orbe"></span>
              {{ quien }}
            </span>
          }
          <a class="topbar__redondo" routerLink="/actividad" title="Actividad reciente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>
          </a>
          <a class="topbar__yo" routerLink="/perfil" [class.topbar__yo--pendiente]="sinUsuario()">
            <span class="topbar__nombre">
              <strong>{{ quienSoy() }}</strong>
              <em>{{ sinUsuario() ? 'falta asignar usuario' : 'Operador' }}</em>
            </span>
            <span class="topbar__avatar">{{ iniciales() }}</span>
          </a>
        </div>
      </header>
    }

    <main class="stage" [class.stage--full]="enLogin()">
      <router-outlet />
    </main>
  </div>
</div>
