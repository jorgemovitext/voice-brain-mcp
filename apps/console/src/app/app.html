<!-- Celda de panal compartida: cualquier elemento con .hex-cell se recorta con
     esta forma. Vive acá, fuera de todo @if, porque un clipPath referenciado
     por url(#…) deja de aplicar si su SVG sale del DOM. En coordenadas
     relativas (objectBoundingBox), así sirve para 30 px o para 150. -->
<svg class="hex-defs" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="hexCell" clipPathUnits="objectBoundingBox">
      <path
        d="M.9.604 L.79.794 Q.73.898.61.898 L.39.898 Q.27.898.21.794 L.1.604 Q.04.5.1.396 L.21.206 Q.27.102.39.102 L.61.102 Q.73.102.79.206 L.9.396 Q.96.5.9.604 Z"
      />
    </clipPath>
  </defs>
</svg>

<div class="shell">
  <!-- Rail de iconos (como la referencia: logo arriba, avatar abajo).
       Oculto en /login: sin sesión no hay navegación que mostrar. -->
  @if (!enLogin()) {
  <aside class="rail">
    <a routerLink="/home" class="rail__logo" title="Movitext Brain">
      <span class="rail__logo-orb"></span>
    </a>

    <nav class="rail__nav">
      <a routerLink="/home" routerLinkActive="rail__btn--active" class="rail__btn" title="La colmena">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      </a>
      <!-- Los agentes suben al segundo lugar: son el corazón de la colmena.
           (Contactos sale del rail; la ruta sigue viva desde la búsqueda.) -->
      <a routerLink="/workers" routerLinkActive="rail__btn--active" class="rail__btn" title="Agentes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 7V4"/><circle cx="12" cy="3" r="1"/><path d="M9 12h.01M15 12h.01"/><path d="M9.5 15.5c.8.6 4.2.6 5 0"/></svg>
      </a>
      <a routerLink="/conversations" routerLinkActive="rail__btn--active" class="rail__btn" title="Conversaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12"/></svg>
      </a>
      <a routerLink="/actividad" routerLinkActive="rail__btn--active" class="rail__btn" title="Actividad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M14 6.5h4a2.5 2.5 0 0 1 2.5 2.5v1"/><path d="M10 17.5H6A2.5 2.5 0 0 1 3.5 15v-1"/></svg>
      </a>
    </nav>

    <div class="rail__bottom">
      <a routerLink="/perfil" routerLinkActive="rail__avatar--active" class="rail__avatar"
         [class.rail__avatar--pendiente]="sinUsuario()"
         [title]="sinUsuario() ? 'Tu cuenta — falta asignar usuario' : 'Tu cuenta'">{{ iniciales() }}</a>
      <button class="rail__btn rail__logout" title="Cerrar sesión" (click)="cerrarSesion()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </aside>
  }

  <main class="stage" [class.stage--full]="enLogin()">
    <router-outlet />
  </main>
</div>
